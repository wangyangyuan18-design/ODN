name: Apply route-direction fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Patch source
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('cable_offset_core.py')
          text = path.read_text(encoding='utf-8')
          original = text

          old = '''            for edge_index, edge in enumerate(edges):
                a, b = _base._edge_points(edge)
                a = _tp(a, edge_crs, work_crs)
                b = _tp(b, edge_crs, work_crs)
                use = _base._LayoutUse(
                    design_index,
                    segment_index,
                    edge_index,
                    edge,
                    start,
                    end,
                    _base._route_side_hint(start, end, a, b),
                )
'''
          new = '''            for edge_index, edge in enumerate(edges):
                # Canonical Edge is directionless. Lane side follows the
                # actual route direction represented by route nodes.
                a = QgsPointXY(nodes[edge_index])
                b = QgsPointXY(nodes[edge_index + 1])
                use = _base._LayoutUse(
                    design_index,
                    segment_index,
                    edge_index,
                    edge,
                    start,
                    end,
                    _base._route_side_hint(start, end, a, b),
                )
                use.route_a = QgsPointXY(a)
                use.route_b = QgsPointXY(b)
'''
          assert old in text, 'collect_uses block not found'
          text = text.replace(old, new, 1)

          old = '''def _build_corner_geometry(node, in_edge, out_edge, prev_slot, next_slot, spacing, return_context=False):
    in_a, in_b = _edge_points_work(in_edge)
    out_a, out_b = _edge_points_work(out_edge)
    decision = _corner_decision(prev_slot, next_slot, return_context=return_context)
'''
          new = '''def _build_corner_geometry(
    node,
    in_a,
    in_b,
    out_a,
    out_b,
    prev_slot,
    next_slot,
    spacing,
    return_context=False,
):
    # These endpoint pairs are the oriented incoming/outgoing route directions.
    decision = _corner_decision(prev_slot, next_slot, return_context=return_context)
'''
          assert old in text, 'corner signature not found'
          text = text.replace(old, new, 1)

          old = '''                edges[edge_index],
                edges[edge_index + 1],
                slot,
                next_slot,
                spacing,
                return_context=bool(segment.get("_odn_return_end")) and edge_index + 1 == len(slots) - 1,
'''
          new = '''                a,
                b,
                b,
                nodes[edge_index + 2],
                slot,
                next_slot,
                spacing,
                return_context=bool(segment.get("_odn_return_end")) and edge_index + 1 == len(slots) - 1,
'''
          assert old in text, 'geometry corner call not found'
          text = text.replace(old, new, 1)

          old = '''            node, prev_edge, next_edge, prev_slot, next_slot, spacing, return_context=False
'''
          new = '''            node,
            left_nodes[-2], node,
            node, right_nodes[1],
            prev_slot, next_slot, spacing, return_context=False
'''
          assert old in text, 'boundary corner call not found'
          text = text.replace(old, new, 1)

          old = '''    _WORK_EDGE_POINTS.clear()
    for edge in edges:
        a, b = _base._edge_points(edge)
        _WORK_EDGE_POINTS[edge] = (_tp(a, edge_crs, work), _tp(b, edge_crs, work))

'''
          assert old in text, 'geometry edge cache not found'
          text = text.replace(old, '    # Route nodes below are the authoritative oriented edge endpoints.\n\n', 1)

          old = '''        _WORK_EDGE_POINTS.clear()
        for edge in (prev_edge, next_edge):
            a, b = _base._edge_points(edge)
            _WORK_EDGE_POINTS[edge] = (_tp(a, edge_crs, work), _tp(b, edge_crs, work))

'''
          assert old in text, 'boundary edge cache not found'
          text = text.replace(old, '        # Boundary corner uses actual route-node direction.\n\n', 1)

          marker = '''            if len(nodes) != len(edges) + 1:
                continue
            start = _tp(
'''
          replacement = '''            if len(nodes) != len(edges) + 1:
                continue
            for edge_index, edge in enumerate(edges):
                ra, rb = nodes[edge_index], nodes[edge_index + 1]
                ca, cb = _base._edge_points(edge)
                ca, cb = _tp(ca, edge_crs, work_crs), _tp(cb, edge_crs, work_crs)
                same = int(hypot(ra.x()-ca.x(), ra.y()-ca.y()) <= 1e-6 and hypot(rb.x()-cb.x(), rb.y()-cb.y()) <= 1e-6)
                _log(
                    f"[route-direction] link={design.get('link','')}; segment={segment_index}; "
                    f"edge={edge_index}; route={_corner_debug_point(ra)}->{_corner_debug_point(rb)}; "
                    f"canonical={_corner_debug_point(ca)}->{_corner_debug_point(cb)}; "
                    f"same={same}; reversed={1-same}"
                )
            start = _tp(
'''
          assert marker in text, 'diagnostic marker not found'
          text = text.replace(marker, replacement, 1)

          assert text != original
          path.write_text(text, encoding='utf-8')
          print('ROUTE-DIRECTION-PATCH: applied')
          PY

      - name: Commit source and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cable_offset_core.py
          git rm .github/workflows/apply-route-direction-fix.yml
          git commit -m "fix: preserve oriented route direction in cable offset"
          git push
